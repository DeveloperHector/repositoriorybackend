
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
        }

        .contenedor {
            text-align: center;
            padding: 45px 30px;
            margin: 20px;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .estado {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #16a34a;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="contenedor">
        <h1>¡Bienvenidos al curso!</h1>
        <p>Mi primera página web con Node.js y GitHub.</p>
        <p>Proyecto de despliegue backend.</p>
        <div class="estado">Servidor funcionando correctamente</div>
    </main>
</body>
</html>
